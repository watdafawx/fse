[shortcut-name]
fstd-theme=Themes


[mod-setting-name]
fstd-flat-game=Themes: flat game windows
fstd-default-theme=Themes: default theme

[mod-setting-description]
fstd-default-theme=The theme each player starts with, until they pick their own in the theme window (its button on the shortcut bar). Two players can still look different.
fstd-flat-game=Draws the game's own windows and buttons with the themes' flat tiles, so "Colour the game's own windows" can make them any colour, light ones too. Without it they keep the game's textures and only get darker or change hue.

